name: Fetch P1 Manager logs

on:
  workflow_dispatch: {}

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Recent logs
        run: flyctl logs -a chs-p1-manager --no-tail
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
