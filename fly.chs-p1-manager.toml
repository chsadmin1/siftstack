# fly.toml for Creative Home Solutions' own instance of the P1 List Manager.
#
# Same shape as fly.p1-manager.toml (525 Homes' instance) -- always-on, one
# machine, one volume -- but a fully separate Fly app on CHS's own Fly.io
# account, with its own DataSift credentials, its own Slack App, and its own
# Slack channel. The two instances share nothing at runtime; they only share
# the same src/p1_manager/ code and Dockerfile.
#
# P1_WEEKLY_DRY_RUN / P1_MONTHLY_DRY_RUN started at '1' for the first
# rollout and were switched to '0' on 2026-10-14 so the Saturday and 28th
# runs actually tag records and post to Slack, as the client deliverable
# describes. Set either back to '1' here (never as a Fly secret, which would
# silently override this block) to pause that job's writes.

app = 'chs-p1-manager'
primary_region = 'iad'

[build]
  dockerfile = 'deploy/Dockerfile.p1-manager'

[env]
  # CHS is Ada + Canyon counties, Idaho: every clock below is Mountain time.
  # (Was America/New_York, which ran the Saturday job at 6 AM Mountain.)
  P1_TIMEZONE = 'America/Boise'
  P1_WEEKLY_AT = '08:00'
  P1_WEEKLY_DAY = 'saturday'
  P1_MONTHLY_AT = '08:00'
  P1_MONTHLY_DAY = '28'
  P1_WEEKLY_DRY_RUN = '0'
  P1_MONTHLY_DRY_RUN = '0'
  # Phone enrichment cost preview, Mon to Fri. Posts to the P1 channel;
  # Trestle runs only when someone replies "approve" (src/p1_manager/enrich.py).
  P1_ENRICH_AT = '07:00,12:00'

[[mounts]]
  source = 'p1_manager_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
